<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>deltachat</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --col: 200px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: monospace;
            font-size: 15px;
            color: rgb(200, 205, 200);
            background-color: #303030;
        }

        #title-container {
            font-size: 15px;
            display: flex;
            justify-content: center;
            padding-top: 1rem;
        }

        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem 1.5rem;
            box-sizing: border-box;
            min-height: 0;
        }

        #bar {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #4a4a4a;
            font-size: 13px;
        }

        #room {
            flex: none;
            width: calc(var(--col) + 1px);
            box-sizing: border-box;
            padding: 10px 14px 10px 0;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-right: 1px solid #4a4a4a;
            color: rgb(120, 135, 120);
        }

        #status {
            flex: 1;
            padding: 10px 14px;
            color: rgb(200, 120, 110);
        }

        #copy {
            font: inherit;
            font-size: 13px;
            color: rgb(180, 200, 180);
            background: transparent;
            border: none;
            padding: 0 14px;
            cursor: pointer;
        }

        #copy:hover {
            color: rgb(235, 238, 235);
        }

        .author {
            color: rgb(180, 200, 180);
        }

        .chat-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0;
            background: linear-gradient(to right,
                    transparent var(--col), #4a4a4a var(--col),
                    #4a4a4a calc(var(--col) + 1px), transparent calc(var(--col) + 1px));
        }

        .chat-container> :first-child {
            margin-top: auto;
        }

        .message-container {
            display: grid;
            grid-template-columns: var(--col) 1fr;
        }

        .meta {
            text-align: right;
            padding: 8px 14px 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message {
            padding: 8px 14px;
            overflow-wrap: anywhere;
        }

        .message-container:nth-child(even) .message {
            background-color: #383838;
        }

        .hint {
            padding: 8px 14px 8px calc(var(--col) + 15px);
            color: rgb(120, 135, 120);
        }

        #composer {
            display: flex;
            align-items: stretch;
            border-top: 1px solid #4a4a4a;
            margin-top: 0;
            padding: 0;
        }

        #me {
            flex: none;
            width: calc(var(--col) + 1px);
            box-sizing: border-box;
            padding: 20px 14px 20px 0;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-right: 1px solid #4a4a4a;
            color: rgb(180, 200, 180);
        }

        #input {
            flex: 1;
            min-width: 0;
            font: inherit;
            font-size: 16px;
            color: rgb(230, 235, 230);
            background: transparent;
            border: none;
            outline: none;
            padding: 20px 14px;
        }

        #input::placeholder {
            color: rgb(120, 135, 120);
        }

        #send {
            font: inherit;
            color: rgb(180, 200, 180);
            background: transparent;
            border: none;
            padding: 0 20px;
            cursor: pointer;
        }

        #send:hover {
            color: rgb(235, 238, 235);
        }

        @media (max-width: 700px) {
            :root {
                --col: 110px;
            }

            #me {
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>
    <div id="title-container">
        <pre class="title">
  ▄       ▗▖             
 ▐█▖      ▐▌         ▐▌  
 ▟▜▌  ▟██▖▐▙██▖ ▟██▖▐███ 
 █ █ ▐▛  ▘▐▛ ▐▌ ▘▄▟▌ ▐▌  
▐▛ ▜▖▐▌   ▐▌ ▐▌▗█▀▜▌ ▐▌  
▟▙▄▟▌▝█▄▄▌▐▌ ▐▌▐▙▄█▌ ▐▙▄ 
▀▀▀▀▀ ▝▀▀ ▝▘ ▝▘ ▀▀▝▘  ▀▀ 
        </pre>
    </div>

    <div id="content">
        <div id="bar">
            <span id="room"></span>
            <span id="status"></span>
            <button id="copy" type="button">copy link</button>
        </div>
        <div class="chat-container" id="messages"></div>

        <form id="composer-form">
            <div id="composer">
                <span id="me"></span>
                <input id="input" autocomplete="off" placeholder="message">
                <button id="send">send</button>
            </div>
        </form>
    </div>

    <script>
        // --- setup ---
        // the room id is everything after the ? and the key is everything after the #
        const roomId = location.search.slice(1);
        const form = document.getElementById("composer-form");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const box = document.getElementById("messages");
        const statusEl = document.getElementById("status");
        const copyBtn = document.getElementById("copy");
        document.getElementById("room").textContent = "?" + roomId;
        const enc = new TextEncoder();
        const dec = new TextDecoder();

        // --- helpers: base64url for the URL, hex for showing raw bytes ---
        function toB64(bytes) {
            let s = "";
            bytes.forEach((b) => (s += String.fromCharCode(b)));
            return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        function fromB64(str) {
            str = str.replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) str += "=";
            return Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
        }

        function toHex(bytes) {
            return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join(" ");
        }

        // --- read the key from the hash. Missing or malformed means null, never a new key ---
        async function loadKey() {
            const k = location.hash.slice(1);
            if (!k) return null;
            try {
                const raw = fromB64(k);
                if (raw.length !== 32) return null;   // a real key is exactly 32 bytes
                return await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
            } catch (e) {
                return null;
            }
        }
        const keyPromise = loadKey();

        // the room ID is bound into every message, so a ciphertext copied into another room fails to decrypt
        const aad = enc.encode(roomId);

        // --- encrypt: fresh random IV each time, stored in front of the ciphertext ---
        async function encrypt(text) {
            const key = await keyPromise;
            if (!key) throw new Error("no key");
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = new Uint8Array(
                await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: aad }, key, enc.encode(text))
            );
            const out = new Uint8Array(12 + ct.length);
            out.set(iv, 0);
            out.set(ct, 12);
            return toB64(out);
        }

        // --- decrypt: split the IV off the front, then decrypt the rest ---
        async function decrypt(str) {
            const key = await keyPromise;
            if (!key) throw new Error("no key");
            const bytes = fromB64(str);
            const plain = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: bytes.slice(0, 12), additionalData: aad },
                key,
                bytes.slice(12)
            );
            return dec.decode(plain);
        }

        // --- display only: turn any string after the # into 32 bytes ---
        // a valid key is used as-is, anything else is hashed, so each wrong key gives its own repeatable output
        async function displayKeyBytes() {
            const h = location.hash.slice(1);
            try {
                const raw = fromB64(h);
                if (raw.length === 32) return raw;
            } catch (e) { }
            return new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(h)));
        }

        // --- display only: decrypt with no authentication check, so any key produces output ---
        // never parse or trust this output, it skips the tamper check
        async function garble(str) {
            const bytes = fromB64(str);
            const k = await crypto.subtle.importKey("raw", await displayKeyBytes(), "AES-CTR", false, ["decrypt"]);
            const counter = new Uint8Array(16);
            counter.set(bytes.slice(0, 12), 0);   // the IV
            counter[15] = 2;                      // GCM's first data block counter
            const out = await crypto.subtle.decrypt(
                { name: "AES-CTR", counter, length: 32 },
                k,
                bytes.slice(12, bytes.length - 16)   // drop the IV in front and the 16-byte tag at the end
            );
            return new Uint8Array(out);
        }

        // --- no usable key: lock the composer so nobody posts messages nobody can read ---
        function lockComposer(reason) {
            input.disabled = true;
            sendBtn.disabled = true;
            input.placeholder = reason;
        }
        keyPromise.then((k) => {
            if (!k) lockComposer("no valid key in this link, read only");
        });

        // --- small status line next to the copy button ---
        let flashTimer;
        function flash(msg) {
            statusEl.textContent = msg;
            clearTimeout(flashTimer);
            flashTimer = setTimeout(() => (statusEl.textContent = ""), 4000);
        }

        // --- copy the invite link ---
        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                copyBtn.textContent = "copied";
            } catch (e) {
                copyBtn.textContent = "copy failed";
            }
            setTimeout(() => (copyBtn.textContent = "copy link"), 1500);
        });

        // --- random username, made in the browser so the server never sees it ---
        const adjectives = [
            "quiet", "red", "swift", "odd", "calm", "bold", "amber", "brisk", "clever", "dusty",
            "eager", "faint", "gentle", "hazy", "icy", "jolly", "keen", "lucky", "mellow", "noble",
            "pale", "proud", "rapid", "rustic", "silent", "sleepy", "smooth", "snowy", "spry", "sunny",
            "tidy", "tiny", "vivid", "warm", "wild", "witty", "young", "zesty", "agile", "bright",
            "cosmic", "crisp", "dizzy", "fuzzy", "golden", "humble", "jaded", "lunar", "misty", "nimble",
            "plain", "quirky", "ruddy", "shy", "stormy", "sturdy", "velvet", "windy", "woolly", "frosty"
        ];
        const nouns = [
            "fox", "owl", "pine", "moth", "reed", "crow", "badger", "beetle", "birch", "canyon",
            "cedar", "comet", "coral", "dune", "eagle", "ember", "falcon", "fern", "finch", "fjord",
            "gecko", "glacier", "harbor", "heron", "ibis", "island", "jaguar", "kelp", "lagoon", "lark",
            "lynx", "maple", "marten", "meadow", "newt", "otter", "panda", "pebble", "plover", "quail",
            "raven", "ridge", "robin", "sparrow", "spruce", "squid", "stoat", "tundra", "turtle", "valley",
            "walrus", "willow", "wolf", "wren", "yak", "zephyr", "aspen", "bison", "cobra", "delta"
        ];
        const pick = (a) => a[Math.floor(Math.random() * a.length)];

        let username = null;
        try { username = sessionStorage.getItem("username"); } catch (e) { }
        if (!username) {
            username = pick(adjectives) + "_" + pick(nouns) + Math.floor(Math.random() * 100);
            try { sessionStorage.setItem("username", username); } catch (e) { }
        }

        // same name always gives the same muted color, only the hue changes
        function colorFor(name) {
            let h = 5381;
            for (let i = 0; i < name.length; i++) {
                h = ((h * 33) ^ name.charCodeAt(i)) >>> 0;   // simple string hash
            }
            return "hsl(" + (h % 360) + ", 38%, 70%)";
        }

        // show your own name next to the composer
        const me = document.getElementById("me");
        me.textContent = username;
        me.style.color = colorFor(username);

        // --- hint shown in an empty room ---
        function clearHint() {
            const h = box.querySelector(".hint");
            if (h) h.remove();
        }

        async function showHint() {
            const key = await keyPromise;
            if (key && shown === 0 && !box.querySelector(".hint")) {
                const h = document.createElement("div");
                h.className = "hint";
                h.textContent = "empty room. copy the link above and send it to someone to invite them.";
                box.append(h);
            }
        }

        // --- draw one message row ---
        function addRow(user, text) {
            clearHint();

            const row = document.createElement("div");
            row.className = "message-container";

            const meta = document.createElement("div");
            meta.className = "meta";
            const name = document.createElement("span");
            name.className = "author";
            name.textContent = user;
            if (user !== "???") name.style.color = colorFor(user);
            meta.append(name);

            const msg = document.createElement("div");
            msg.className = "message";
            msg.textContent = text;   // textContent stops typed HTML from running

            row.append(meta, msg);
            box.append(row);
        }

        // --- polling: fetch the list, decrypt what we can, show scrambled bytes for what we can't ---
        let shown = 0;           // how many messages are already on screen
        let polling = false;     // stops two polls from running at once and drawing duplicates
        let forceStick = false;  // set after you send, so your own message scrolls into view
        let unread = 0;          // messages that arrived while the tab was in the background

        async function poll() {
            if (polling) return;
            polling = true;
            try {
                const res = await fetch("/api/room/" + roomId);
                const list = await res.json();

                // only follow new messages if the view is already at the bottom
                const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
                const stick = forceStick || shown === 0 || atBottom;
                let added = 0;

                for (let i = shown; i < list.length; i++) {
                    try {
                        const m = JSON.parse(await decrypt(list[i]));
                        addRow(m.u, m.t);
                    } catch (e) {
                        // wrong key or no key: show what a no-check decrypt gives with this key
                        let shownBytes;
                        try { shownBytes = await garble(list[i]); }
                        catch (err) { shownBytes = enc.encode(list[i]); }
                        addRow("???", toHex(shownBytes));
                        // the very first message failing is a strong sign of a wrong key
                        if (i === 0 && (await keyPromise)) lockComposer("wrong key for this room, read only");
                    }
                    shown = i + 1;
                    added++;
                }

                if (added && stick) box.scrollTop = box.scrollHeight;
                forceStick = false;

                if (added && document.hidden) {
                    unread += added;
                    document.title = "(" + unread + ") deltachat";
                }
                if (shown === 0) showHint();
            } catch (e) {
                // server unreachable, try again on the next tick
            }
            polling = false;
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                unread = 0;
                document.title = "deltachat";
            }
        });

        // --- sending: if it fails, the text goes back in the box and a message shows ---
        form.addEventListener("submit", async (e) => {
            e.preventDefault();                  // stops the page from navigating
            const text = input.value.trim();
            if (!text || input.disabled) return;
            input.value = "";

            try {
                const payload = await encrypt(JSON.stringify({ u: username, t: text }));
                const res = await fetch("/api/room/" + roomId, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: payload
                });
                if (!res.ok) throw new Error("status " + res.status);
                forceStick = true;
                poll();                          // show it right away
            } catch (err) {
                input.value = text;
                flash("send failed, your message is still in the box");
            }
            input.focus();
        });

        // --- start ---
        input.focus();
        poll();
        setInterval(poll, 1500);
    </script>
</body>

</html>
